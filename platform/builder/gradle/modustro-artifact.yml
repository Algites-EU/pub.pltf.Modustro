# $schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/modustro-artifact_1.yamldef.schema.json
$schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/modustro-artifact_1.yamldef.schema.json
Artifact:
  TechnologyKinds: [java]
  Name: Modustro Builder Gradle integration
  Description: Compiled Settings and Project adapters with a single Builder classpath per build domain.
# The settings plugin must load on every supported Gradle 9.x runtime.
# Keep its JVM bytecode baseline explicit even when repository defaults change.
EnvironmentRequirements:
  Java:
    Minimum: ">=17"
    Prefer: "17"

Dependencies:
  - DependencyKind: modustro
    Items:
      - GroupId: eu.algites.pltf.modustro.builder
        ArtifactId: pub.pltf.Modustro_platform.builder.core.intf
        Usages: [product_api]
      - GroupId: eu.algites.pltf.modustro.builder
        ArtifactId: pub.pltf.Modustro_platform.builder.runtime
        Usages: [product_api]
      # Credential integrations are supplied by versioned Security artifacts,
      # never by the incompatible 1.0 generation of credential classes.
      - GroupId: eu.algites.lib.security
        ArtifactId: pub.lib.Security_credentials.core.impl
        Usages: [product_runtime_only]
        VersionRequirement:
          Exact: "1.1-SNAPSHOT"
      - GroupId: eu.algites.tool.security
        ArtifactId: pub.tool.Security_credentials.gradle
        Usages: [product_runtime_only]
        VersionRequirement:
          Exact: "1.1-SNAPSHOT"
  - DependencyKind: java
    Items:
      - GroupId: org.testng
        ArtifactId: testng
        Usages: [develop_implementation]
        VersionRequirement:
          Exact: "7.11.0"
